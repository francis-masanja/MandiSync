name: CI

on:
  push:
    branches: [ main, setup/base ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security Audit
        run: |
          npm audit --audit-level=high || echo "High‑severity issues found – CI will still pass but you should review them"
