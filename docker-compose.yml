version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mandi-postgres
    environment:
      POSTGRES_DB: mandi_queue
      POSTGRES_USER: mandi_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_in_prod}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandi_admin -d mandi_queue"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mandi-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: mandi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mandi-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  mosquitto:
    image: eclipse-mosquitto:2-openssl
    container_name: mandi-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-i", "healthcheck", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mandi-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend-cpp:
    build:
      context: ./backend-cpp
      dockerfile: Dockerfile
      target: production
    container_name: mandi-backend-cpp
    environment:
      DATABASE_URL: postgresql://mandi_admin:${POSTGRES_PASSWORD:-secure_password_change_in_prod}@postgres:5432/mandi_queue
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_min_32_chars}
      HMAC_SECRET: ${HMAC_SECRET:-change_this_hmac_secret_min_32_chars}
      API_PORT: 8080
      WS_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mandi-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: mandi-frontend
    environment:
      VITE_API_URL: https://${DOMAIN:-localhost}/api
      VITE_WS_URL: wss://${DOMAIN:-localhost}/ws
      VITE_APP_NAME: "Smart Mandi Queue System"
    ports:
      - "3000:80"
    depends_on:
      - backend-cpp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mandi-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: mandi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      - backend-cpp
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mandi-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  frontend_static:
    driver: local

networks:
  mandi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16